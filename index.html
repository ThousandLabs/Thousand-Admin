<meta name="mobile-web-app-capable" content="yes">

<title>Thousand Admin</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b1428;--card:#13203d;--card2:#1a2a4d;--text:#eef3ff;--muted:#93a3c7;--line:#24365e;--pri:#4f8cff;--pri2:#2f66e8;--soft:#16294f;--danger:#ff6b6b;--ok:#3ddc97;--app:#4f8cff;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px;padding-top:calc(12px + env(safe-area-inset-top))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.brand{display:flex;align-items:center;gap:10px}.brand svg{width:40px;height:40px}
.brand b{display:block;font-size:17px}.brand small{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
input,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);outline:none}
textarea{min-height:80px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
input:focus,textarea:focus{border-color:var(--app)}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600;text-decoration:none;color:var(--text);text-align:center}
.btn.pri{background:var(--app);color:#14101e;border:0}
.btn.gold{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0}
.btn.block{display:flex;width:100%;margin-top:12px}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--danger)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1}
.codebox{font:700 13px/1.5 ui-monospace,Menlo,monospace;word-break:break-all;color:var(--app);padding:12px 14px;border-radius:14px;background:var(--card2);border:1px dashed var(--app);margin-top:8px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.tab{padding:10px 4px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:12px}
.tab small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.tab.on{border-color:var(--app);background:var(--card2);box-shadow:0 0 0 2px var(--app) inset}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--app)}.stats small{color:var(--muted);font-size:12px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.li .g{flex:1;min-width:0}.li .g b,.li .g small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .g small{color:var(--muted);font-size:12px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line)}
.center{max-width:400px;margin:0 auto;padding:48px 18px;text-align:center}
.center .card{text-align:left}.center svg:not(.eic){width:72px;height:72px;margin:0 auto 10px}
.ok{color:var(--ok)}.bad{color:var(--danger)}
.qr{display:block;width:100%;max-width:320px;height:auto;margin:12px auto;border-radius:14px;image-rendering:pixelated}
.scanbox{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:1/1;max-width:360px;margin:12px auto}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox i{position:absolute;inset:14%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:620px){.ov{align-items:center}.sheet{border-radius:24px}}
.cm{text-align:center}
.hidden{display:none!important}
body.games{--bg:#140b24;--card:#1f1238;--card2:#2a1a4a;--line:#3b2766;--muted:#b3a3d6;--soft:#24163f}
body.games .brand svg rect{fill:#2a1a4a;stroke:#6d4bb3}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:#151834;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>

/* ---------- lecture d'un message WhatsApp collé ----------
   On ne garde que ce qui ressemble à un identifiant de l'appli (NX-…, BF-…, PL-…, TD-…,
   ou 24 caractères hexadécimaux pour ScoreUp) ; tout le reste du message est ignoré.
   strict=true : pas d'essai « identifiant tapé sans préfixe ». */
const ID_PREFIX={nexus:'NX',budget:'BF',power:'PL',newworld:'NW',tonedial:'TD'};
function findIds(app,text,strict){const A=APPS[app],t=String(text||''),ids=[],bad=[];
  const add=v=>{const id=A.norm(v);if(id&&!ids.includes(id))ids.push(id);return id};
  if(app==='scoreup'){(t.match(/[0-9a-f]{4}(?:[\s-]?[0-9a-f]{4}){5}/gi)||[]).forEach(add)}
  else{const re=new RegExp('\\b'+ID_PREFIX[app]+'[\\s:_-]*([A-Za-z0-9]{4})[\\s_-]*([A-Za-z0-9]{4})(?![A-Za-z0-9])','gi');let m;
    while((m=re.exec(t)))if(!add(m[1]+m[2])&&!bad.includes(m[0].toUpperCase()))bad.push(m[0].toUpperCase())}
  if(!ids.length&&!bad.length&&!strict)add(t);
  return {ids,bad}}
/* Autres applis présentes dans le message (si l'onglet ouvert n'est pas le bon) */

/* Infos du message d'achat envoyé par les applis : numéro qui a payé, pack, moyen de paiement, nom */
function parseMsg(text){const t=String(text||''),r={};
  let m=t.match(/depuis le\s*(\+?\d[\d .]{6,}\d)/i);if(m)r.phone=m[1].replace(/\s+/g,' ').trim();
  m=t.match(/—\s*(\d+)\s+(?:personnes?|appareils?)\s*(\([^)]*\))?/i);if(m){r.pack=+m[1];r.packTxt='pack '+m[1]+(m[2]?' '+m[2].replace(/\s+/g,' '):'')}
  m=t.match(/Paiement\s*:\s*(?:en\s+)?([^\n]+?)(?:\s+depuis\b|\.?\s*$)/im);if(m)r.pay=m[1].replace(/[.,]\s*$/,'').trim();
  m=t.match(/^\s*\[[^\]\n]+\]\s*([^:\n]{2,40}):/m);if(m)r.name=m[1].trim();
  r.note=[r.packTxt,r.pay].filter(Boolean).join(', ');return r}

/* ---------- crypto ---------- */
const S=crypto.subtle,enc=s=>new TextEncoder().encode(s);
const b64=u=>{let s='';u=new Uint8Array(u);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const b64u=u=>b64(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=t=>{t=String(t).replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return unb64(t)};
async function aesKey(pass,salt,iter,use){const base=await S.importKey('raw',enc(pass),'PBKDF2',false,['deriveKey']);return S.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,[use])}
async function openVault(v,pass){const k=await aesKey(pass,unb64(v.salt),v.iter,'decrypt');const pt=await S.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function sealVault(keys,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=210000;const k=await aesKey(pass,salt,iter,'encrypt');const ct=await S.encrypt({name:'AES-GCM',iv},k,enc(JSON.stringify(keys)));return {v:1,iter,salt:b64(salt),iv:b64(iv),ct:b64(ct)}}
async function sign(app,id){const k=await S.importKey('jwk',KEYS[app],{name:'ECDSA',namedCurve:'P-256'},false,['sign']);return b64u(await S.sign({name:'ECDSA',hash:'SHA-256'},k,enc(id)))}
const pubOf=app=>KEYS&&KEYS[app]?{kty:'EC',crv:'P-256',x:KEYS[app].x,y:KEYS[app].y}:PUB[app];
/* État de la clé : none (aucune), ok (installée dans l'appli), pending (nouvelle, appli pas encore mise à jour), retired (ancienne, à remplacer) */
const keyState=app=>!KEYS||!KEYS[app]?'none':RETIRED.includes(KEYS[app].x)?'retired':(PUB[app]&&KEYS[app].x===PUB[app].x)?'ok':'pending';
async function newKey(){const kp=await S.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const j=await S.exportKey('jwk',kp.privateKey);return {kty:'EC',crv:'P-256',x:j.x,y:j.y,d:j.d}}
const pubMsg=()=>'THOUSAND-PUB '+JSON.stringify(Object.fromEntries(Object.keys(APPS).filter(k=>KEYS[k]&&!RETIRED.includes(KEYS[k].x)).map(k=>[k,{x:KEYS[k].x,y:KEYS[k].y}])));

async function verify(app,id,code){try{const k=await S.importKey('jwk',pubOf(app),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);return await S.verify({name:'ECDSA',hash:'SHA-256'},k,unb64u(code),enc(id))}catch(e){return false}}

/* ---------- Transfert de licence ----------
   L'appli du client calcule un code de transfert à partir de son identifiant et de son code
   d'activation, puis se verrouille. On vérifie ici : 1) que le code d'activation (« preuve »)
   est authentique pour l'ancien identifiant, 2) que le code de transfert correspond,
   3) que cette licence n'a pas déjà été transférée. Même calcul que TLX.code dans les applis. */
const XAL='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
async function xferCode(app,id,sig){const d=new Uint8Array(await S.digest('SHA-256',enc('TL-XFER/v1|'+app+'|'+id+'|'+sig)));let s='';for(let i=0;i<10;i++)s+=XAL[d[i]%XAL.length];return s.slice(0,5)+'-'+s.slice(5)}
async function licOk(app,id,sig){if(await verify(app,id,sig))return true;const hx=Array.from(new Uint8Array(await S.digest('SHA-256',enc(id+':'+sig))),b=>b.toString(16).padStart(2,'0')).join('');return (LEGACY[app]||[]).includes(hx)}
const XFER_APPS=['scoreup','budget','nexus','power'];
function parseXfer(text){const t=String(text||''),r={};
  r.app=XFER_APPS.find(k=>new RegExp('licence\\s+'+APPS[k].name.replace(/\s+/g,'\\s+'),'i').test(t))||null;
  let m=t.match(/Code de transfert\s*:\s*([A-Za-z0-9]{5})[\s-]?([A-Za-z0-9]{5})/i);if(m)r.code=(m[1]+'-'+m[2]).toUpperCase();
  m=t.match(/Preuve de licence\s*:\s*([A-Za-z0-9_\-+\/=]{20,})/i);if(m)r.sig=m[1];
  m=t.match(/Ancien identifiant\s*:\s*([^\n]+)/i);r.oldRaw=m?m[1].trim():'';
  r.rest=t.replace(/Preuve de licence\s*:[^\n]*/ig,'').replace(/Ancien identifiant\s*:[^\n]*/ig,'').replace(/Code de transfert\s*:[^\n]*/ig,'');
  return r}
/* Chaîne des transferts d'une licence : combien de fois elle a déjà changé de téléphone */
function xferCount(h,app,id){let n=0,c=id,seen={};for(;;){const e=h.find(x=>x.app===app&&x.id===c&&x.xferFrom);if(!e||seen[c])break;seen[c]=1;n++;c=e.xferFrom}return n}

/* ---------- QR code : générateur intégré (hors ligne) + lecteur caméra ---------- */
const QR=(()=>{
  const ECC={L:[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],M:[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28]};
  const BLK={L:[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],M:[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]};
  const FMT={L:1,M:0};
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const rawModules=v=>{let r=(16*v+128)*v+64;if(v>=2){const na=Math.floor(v/7)+2;r-=(25*na-10)*na-55;if(v>=7)r-=36}return r};
  const dataCw=(v,e)=>Math.floor(rawModules(v)/8)-ECC[e][v]*BLK[e][v];
  const alignPos=v=>{if(v===1)return [];const na=Math.floor(v/7)+2,size=v*4+17,step=v===32?26:Math.ceil((v*4+4)/(na*2-2))*2,r=[6];for(let p=size-7;r.length<na;p-=step)r.splice(1,0,p);return r};
  const rsDiv=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const rsRem=(data,div)=>{const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f)})}return r};
  const MASKS=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  function penalty(M,n){let p=0,dark=0;
    for(let a=0;a<n;a++){let rr=1,rc=1;for(let b=1;b<=n;b++){if(b<n&&M[a][b]===M[a][b-1])rr++;else{if(rr>=5)p+=rr-2;rr=1}if(b<n&&M[b][a]===M[b-1][a])rc++;else{if(rc>=5)p+=rc-2;rc=1}}}
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(M[y][x])dark++;if(y<n-1&&x<n-1){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}}
    return p+Math.max(0,Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10}
  function encode(text,e){e=e||'L';const bytes=Array.from(new TextEncoder().encode(text));let v=1,cap=0;
    for(;v<=40;v++){cap=dataCw(v,e)*8;if(4+(v<10?8:16)+bytes.length*8<=cap)break}
    if(v>40)throw new Error('Données trop longues pour un QR code');
    const bits=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    const nb=BLK[e][v],el=ECC[e][v],raw=Math.floor(rawModules(v)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-el+(i<nShort?0:1));k+=dat.length;const ec=rsRem(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(ec))}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-el||j>=nShort)all.push(b[i])});
    const size=v*4+17,M=Array.from({length:size},()=>new Array(size).fill(false)),F=Array.from({length:size},()=>new Array(size).fill(false));
    const setF=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
    [[3,3],[size-4,3],[3,size-4]].forEach(([cx,cy])=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const xx=cx+dx,yy=cy+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size){const d=Math.max(Math.abs(dx),Math.abs(dy));setF(xx,yy,d!==2&&d!==4)}}});
    const ap=alignPos(v),na=ap.length;
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
    const drawFmt=m=>{const d=FMT[e]<<3|m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)setF(8,i,g(i));setF(8,7,g(6));setF(8,8,g(7));setF(7,8,g(8));for(let i=9;i<15;i++)setF(14-i,8,g(i));
      for(let i=0;i<8;i++)setF(size-1-i,8,g(i));for(let i=8;i<15;i++)setF(8,size-15+i,g(i));setF(8,size-8,true)};
    drawFmt(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const bt=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);setF(a,c,bt);setF(c,a,bt)}}

/* Lecteur : BarcodeDetector (Android/Chrome) sinon jsQR chargé à la demande (puis gardé hors ligne) */
let scanStream=null,scanTimer=null;
function loadJsQR(){return new Promise((ok,ko)=>{if(window.jsQR)return ok();const s=document.createElement('script');s.src='./jsQR.js';/* jsQR 1.4.0 (github.com/cozmo/jsQR), hébergé avec l'appli : aucun script externe */s.onload=()=>window.jsQR?ok():ko();s.onerror=ko;document.head.appendChild(s)})}
async function startScan(video,status,onText){
  stopScan();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status.textContent='📵 Caméra non disponible ici. Ouvre l\'appli installée (site en https).';return}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){status.textContent='📵 Accès à la caméra refusé. Autorise-le dans les réglages du navigateur.';return}
  video.setAttribute('playsinline','');video.muted=true;video.srcObject=scanStream;try{await video.play()}catch(e){}
  let detect=null;
  if('BarcodeDetector' in window){try{const bd=new BarcodeDetector({formats:['qr_code']});detect=async()=>{const r=await bd.detect(video);return r.length?r[0].rawValue:null}}catch(e){detect=null}}
  if(!detect){status.textContent='Chargement du lecteur…';try{await loadJsQR()}catch(e){status.textContent='❌ Lecteur QR indisponible hors ligne sur ce téléphone. Utilise le message ou le fichier.';stopScan();return}
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    detect=async()=>{const w=video.videoWidth,h=video.videoHeight;if(!w)return null;const s=Math.min(1,720/Math.max(w,h));cv.width=w*s|0;cv.height=h*s|0;cx.drawImage(video,0,0,cv.width,cv.height);const r=window.jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});return r?r.data:null}}
  if(!scanStream)return;
  status.textContent='🎯 Vise le QR code…';
  let busy=false;scanTimer=setInterval(async()=>{if(busy||!scanStream)return;busy=true;try{const t=await detect();if(t)onText(t)}catch(e){}busy=false},160);
}
function stopScan(){clearInterval(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}

    const nid=nids[0],src=h.find(y=>y.app===app&&y.id===old)||{},n=xferCount(h,app,old),now=Date.now();
    const code=await sign(app,nid);
    h.unshift({at:now,app,id:nid,code,client:src.client||'',phone:src.phone||'',note:'transfert depuis '+showId(app,old)+(n?' · '+(n+1)+'e transfert':''),xferFrom:old});saveHistory(h);
    const warn=[];if(n)warn.push('Ce client a déjà transféré sa licence '+n+' fois avant celui-ci ('+(n+1)+'e transfert).');
    if(!src.at)warn.push('L\'ancien identifiant n\'est pas dans ton historique (preuve vérifiée quand même) : vérifie qui est ce client.');
    last={app,client:src.client||'',phone:src.phone||'',items:[{id:nid,code,dup:0}],warn:warn.join(' '),xfer:1};render();window.scrollTo(0,0);
    toast('🔁 Transfert vérifié : nouveau code prêt')},
  check:async fd=>{const id=APPS[cur].norm(fd.get('id')),r=$('#checkRes');if(!id){r.innerHTML='<span class="bad">❌ Identifiant invalide</span>';return}
    const c=String(fd.get('code')).replace(/\s+/g,'').replace(/^[A-Z]+CODE:/,'');if(await verify(cur,id,c)){r.innerHTML='<span class="ok">✅ Code valide pour cet appareil</span>';return}
    const hx=Array.from(new Uint8Array(await S.digest('SHA-256',enc(id+':'+c))),b=>b.toString(16).padStart(2,'0')).join('');
    r.innerHTML=(LEGACY[cur]||[]).includes(hx)?'<span class="ok">✅ Ancien code de l\'équipe : toujours valable sur cet appareil</span>':'<span class="bad">❌ Code invalide pour cet appareil</span>'},
  editRec:fd=>{const at=String(fd.get('at')),h=history_(),x=h.find(y=>String(y.at)===at);if(!x){closeSheet();toast('❌ Code introuvable');return}
    const oc=x.client||'',op=x.phone||'',client=String(fd.get('client')||'').trim(),phone=String(fd.get('phone')||'').trim(),note=String(fd.get('note')||'').trim();
    x.client=client;x.phone=phone;x.note=note;
    /* Les autres codes du même appareil (ex. « nouveau code ») restés sans nom / sans numéro reçoivent aussi ces infos */
    h.forEach(y=>{if(y!==x&&y.app===x.app&&y.id===x.id){if(client&&!y.client)y.client=client;if(phone&&!y.phone)y.phone=phone}});
    saveHistory(h);
    if(last&&last.app===x.app&&last.items.some(it=>it.id===x.id)&&(last.client===oc||!last.client)&&(last.phone===op||!last.phone)){last.client=client;last.phone=phone}
    closeSheet();render();toast('Infos enregistrées ✅')},
  chpass:async fd=>{const p=String(fd.get('p'));if(p.length<10){toast('10 caractères minimum');return}PASS=p;await saveKeys();toast('Mot de passe changé ✅ — refais une sauvegarde');render()}
};
const ACT={
  tab:t=>{cur=t.dataset.k;lsSet(AKEY,cur);q='';render()},
  space:()=>{SPACE=SPACE==='games'?'labs':'games';lsSet(SKEY,SPACE);cur=spaceApps()[0];lsSet(AKEY,cur);q='';last=null;render();window.scrollTo(0,0);toast(SPACE==='games'?'🎮 Espace Thousand Games':'Espace Thousand Admin')},
  logout:()=>{KEYS=null;PASS=null;last=null;render()},
  copy:t=>copyText(t.dataset.t),
  newKey:async()=>{const A=APPS[cur];if(KEYS[cur]&&!confirm('Remplacer la clé '+A.name+' ? Les codes faits avec l\'ancienne clé cesseront de marcher quand '+A.name+' sera mise à jour.'))return;
    try{const k=await newKey();KEYS[cur]=k;await saveKeys();render();toast('✅ Nouvelle clé '+A.name+' créée sur ce téléphone')}catch(e){toast('❌ Création impossible sur ce navigateur')}},
  copyPub:()=>{const m=pubMsg();if(m==='THOUSAND-PUB {}'){toast('Aucune nouvelle clé pour l\'instant');return}copyText(m)},
  regen:async t=>{const h=history_(),x=h.find(y=>String(y.at)===t.dataset.at);if(!x||!KEYS[x.app])return;
    const code=await sign(x.app,x.id),now=Date.now();h.unshift({at:now,app:x.app,id:x.id,code,client:x.client,phone:x.phone,note:(x.note?x.note+' · ':'')+'nouveau code'});saveHistory(h);
    cur=x.app;lsSet(AKEY,cur);last={app:x.app,client:x.client,phone:x.phone,items:[{id:x.id,code,dup:0}],warn:''};render();window.scrollTo(0,0);toast('🔄 Nouveau code prêt : envoie-le au client')},
  edit:t=>{const x=history_().find(y=>String(y.at)===t.dataset.at);if(!x)return;const A=APPS[x.app]||APPS[cur];
    openSheet('<div class="row"><b>✍️ Modifier les infos</b><button class="btn sm" data-act="closeSheet">✕</button></div><p class="muted small cm">'+esc(A.name)+' · '+esc(showId(x.app,x.id))+' · '+new Date(x.at).toLocaleDateString('fr-FR')+'<br>Le code ne change pas : seules les infos de l\'historique sont modifiées.</p><form data-form="editRec"><input type="hidden" name="at" value="'+x.at+'"><label>Nom du client</label><input name="client" maxlength="40" placeholder="Ex : Awa Diop" value="'+esc(x.client||'')+'"><label>WhatsApp</label><input name="phone" type="tel" inputmode="tel" maxlength="20" placeholder="77 123 45 67" value="'+esc(x.phone||'')+'"><label>Note (pack, prix…)</label><input name="note" maxlength="120" placeholder="Ex : pack 5, payé Wave" value="'+esc(x.note||'')+'"><button class="btn pri block">Enregistrer</button></form>');
    const i=document.querySelector('form[data-form=editRec] [name=client]');if(i)setTimeout(()=>i.focus(),50)},
  closeSheet:()=>closeSheet(),
  scanId:()=>{const A=APPS[cur];openSheet('<div class="row"><b>📷 Scanner l\'identifiant</b><button class="btn sm" data-act="closeSheet">✕</button></div><p class="muted small cm">'+A.hint+'</p><div class="scanbox"><video id="scanV"></video><i></i></div><p id="scanS" class="small cm">Ouverture de la caméra…</p>');
    startScan($('#scanV'),$('#scanS'),t=>{t=String(t).trim();let id=null;for(const [k,a] of Object.entries(APPS)){if(t.startsWith(a.qid)){if(k!==cur){$('#scanS').textContent='⚠️ Ce QR est pour '+a.name+', pas '+A.name;return}id=A.norm(t.slice(a.qid.length))}}
      if(!id)id=A.norm(t);if(id){closeSheet();const i=document.querySelector('form[data-form=gen] [name=id]');if(i){const sv=showId(cur,id);if(!i.value.includes(sv))i.value=(i.value.trim()?i.value.trim()+'\n':'')+sv;liveIds()}try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}toast('Identifiant scanné ✅')}})},
  showCodeQR:t=>{if(!last)return;const A=APPS[cur],it=last.items[+t.dataset.i||0];if(!it)return;openSheet('<div class="row"><b>🔳 Code de '+esc(last.items.length>1?showId(cur,it.id):(last.client||showId(cur,it.id)))+'</b><button class="btn sm" data-act="closeSheet">✕</button></div><p class="muted small cm">'+A.scanHint+' L\'appli s\'active toute seule.</p><div id="qrBox"></div>');$('#qrBox').appendChild(QR.canvas(A.qcode+it.code,640,'M'))},
  copyMsg:()=>{if(last)copyText(waText())},
  sendWa:()=>{if(!last)return;const txt=waText();
    window.open(last.phone?'https://wa.me/'+waPhone(last.phone)+'?text='+encodeURIComponent(txt):'https://wa.me/?text='+encodeURIComponent(txt),'_blank')},
  del:t=>{if(!confirm('Retirer ce code de l\'historique ? (Il reste valable sur le téléphone du client.)'))return;saveHistory(history_().filter(x=>String(x.at)!==t.dataset.at));render()},
  csv:()=>{const h=history_();const rows=[['Date','Appli','Client','WhatsApp','Identifiant','Note','Code']].concat(h.map(x=>[new Date(x.at).toLocaleString('fr-FR'),APPS[x.app]?APPS[x.app].name:x.app,x.client,x.phone,showId(x.app,x.id),x.note,x.code]));
    const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='thousand-codes-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500)},
  backupVault:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'thousand-admin-vault',at:Date.now(),vault:localVault()})],{type:'application/json'}));a.download='thousand-admin-cles-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);lsSet(BKEY,String(Date.now()));render();toast('Sauvegarde téléchargée 💾 : garde-la à deux endroits hors du téléphone (WhatsApp à toi-même + clé USB ou ordinateur)')}
};
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();FORMS[f.dataset.form]&&FORMS[f.dataset.form](new FormData(f),f)});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act]){e.preventDefault();ACT[t.dataset.act](t)}});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});
document.addEventListener('input',e=>{if(e.target.id==='idIn'||(e.target.name==='phone'&&e.target.form&&e.target.form.dataset.form==='gen')){liveIds();return}if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#q');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('change',async e=>{const t=e.target;if(!t.dataset.file||!t.files||!t.files[0])return;const txt=await t.files[0].text();t.value='';
  if(t.dataset.file==='vault'){try{const o=JSON.parse(txt);if(o.app!=='thousand-admin-vault'||!o.vault)throw 0;lsSet(VKEY,JSON.stringify(o.vault));render();toast('✅ Clés restaurées : entre le mot de passe de cette sauvegarde')}catch(_){toast('❌ Fichier de sauvegarde invalide')}}});
if(!(window.crypto&&crypto.subtle))document.addEventListener('DOMContentLoaded',()=>toast('⚠️ Ouvre Thousand Admin depuis son lien https'));
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
</script>
</body>
